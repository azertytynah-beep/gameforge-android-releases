.focus-layout{display:grid;grid-template-columns:155px minmax(0,1fr) 222px;gap:26px;align-items:start}.rail{padding-top:20px}.rail button{display:flex;align-items:center;gap:11px;text-align:left;color:var(--muted);border:0;background:none;width:100%;padding:12px 0;font-size:12px}.rail .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);font-size:10px;display:grid;place-items:center;flex:none}.rail .active{color:var(--text);font-weight:600}.rail .active .dot{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 0 25px #a3cfd327}.rail .rail-foot{padding-top:55px;font-size:11px;color:var(--muted);line-height:1.7}.focus-question{padding:30px}.focus-question h2{font-size:30px;line-height:1.25;letter-spacing:-1.1px;margin-top:16px;font-weight:580;max-width:550px}.focus-question .example{font-size:13px;color:var(--muted);line-height:1.75;margin-top:12px}.focus-question .bottom{border-top:1px solid var(--edge);padding-top:20px;margin-top:25px}.focus-question .position{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:16px}.track{display:flex;gap:4px}.track i{width:19px;height:3px;border-radius:3px;background:var(--edge)}.track i.done{background:var(--accent)}.brief-aside{padding-top:17px}.brief-aside h3{font-size:14px;letter-spacing:-.3px;margin-top:9px}.aside-visual{background:radial-gradient(ellipse at center,#76918d22,transparent 70%);border:1px solid var(--edge);border-radius:19px;margin-top:16px}.caption{font-size:10px;text-align:center;margin:-17px 0 12px;color:var(--muted)}

.demo-footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--edge);padding-top:18px;margin-top:30px;font-size:11px;color:var(--muted);line-height:1.6}.demo-footer button{background:transparent;color:var(--accent);border:0;font:inherit;white-space:nowrap}.aura{position:fixed;pointer-events:none;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#8ca9e81a,transparent 68%);transform:translate(-50%,-50%);opacity:0;z-index:20;transition:opacity .25s;mix-blend-mode:screen}.liquid{position:relative;overflow:hidden}.liquid:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#a7c6ff20,transparent 70%);opacity:0;transition:opacity .25s}.liquid:hover:after{opacity:1}.reduced .aura{display:none}.reduced .liquid:after{transition:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(540px,90vw);background:#e0faed;color:#18392d;padding:14px 21px;border:1px solid #ffffff50;border-radius:13px;font-size:13px;line-height:1.6;box-shadow:0 12px 60px #0005;z-index:30}.toast:empty{display:none}dialog{background:#20283b;color:#f5f6fc;border:1px solid #b8c5ef40;max-width:450px;width:90%;border-radius:22px;padding:28px}dialog::backdrop{background:#050a1699;backdrop-filter:blur(5px)}dialog h2{font-size:22px;margin-bottom:12px}dialog p{font-size:14px;line-height:1.8;color:#c2cbe0}dialog button{margin-top:20px;padding:10px 17px;border:0;border-radius:10px;background:#ceffea;color:#16392b}

</head><body>
<div class="toolbar"><strong>Maquettes du questionnaire · Prisme</strong><div class="variants" aria-label="Choisir une maquette"><button data-layout="focus" aria-pressed="true">01 · Focus</button><button data-layout="carnet" aria-pressed="false">02 · Carnet</button><button data-layout="dialogue" aria-pressed="false">03 · Dialogue</button></div><button class="tool" id="theme">Passer en clair</button><button class="tool" id="motion" aria-pressed="false">Réduire les effets</button></div>
<main id="studio"></main><div id="aura" class="aura" aria-hidden="true"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="voice-demo"><h2>Un bouton pour raconter ton idée</h2><p>Ce bouton illustre la place de la dictée. Aucun microphone n’est activé dans ces maquettes et aucun enregistrement n’est réalisé.</p><button id="close-voice">Continuer à écrire</button></dialog>
<script>
const studio=document.querySelector('#studio'),toast=document.querySelector('#toast'),aura=document.querySelector('#aura');
const variants={focus:'Focus',carnet:'Carnet',dialogue:'Dialogue'},chapters=['Intention','Univers visuel','Ennemis','Règles du jeu','Confort'];
const questions=[{title:'À quoi ressemblent tes ennemis ?',help:'Décris leur silhouette, leurs matières et le détail qui les rend reconnaissables.',hint:'Ex. Des zombies en tenues de bureau, aux yeux blancs. Ils avancent en boitant, avec des vêtements déchirés.',answer:'Des zombies en tenue de bureau, un peu maladroits. Leurs yeux brillent doucement et leurs vêtements sont abîmés. Ils doivent être inquiétants, sans être trop réalistes.'},{title:'Comment réagissent-ils à l’arrivée du joueur ?',help:'Raconte leur comportement et le signe qui annonce une attaque.',hint:'Ex. Ils attendent dans les ruelles, se tournent vers moi, puis chargent après un cri bref.',answer:''},{title:'Comment le joueur peut-il les éviter ou les vaincre ?',help:'Décris une action concrète, ses limites et ce qui rend la rencontre intéressante.',hint:'Ex. Je change de voie pour les contourner. Un bouclier rare permet de traverser un groupe.',answer:''}];
let layout='focus',theme='sombre',question=0,chapter=2,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,toastTimer;
try{const saved=JSON.parse(localStorage.getItem('gameforge-questionnaire-demo')||'null');if(saved){question=Math.max(0,Math.min(2,saved.question||0));questions.forEach((q,i)=>{if(typeof saved.answers?.[i]==='string')q.answer=saved.answers[i];});}}catch{}
const params=new URLSearchParams(location.search);if(Object.hasOwn(variants,params.get('layout')))layout=params.get('layout');if(params.get('theme')==='clair')theme='clair';
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem('gameforge-questionnaire-demo',JSON.stringify({question,answers:questions.map(q=>q.answer)}));}catch{}document.querySelectorAll('.save').forEach(el=>el.textContent='Brouillon démo enregistré');}
function notify(text){clearTimeout(toastTimer);toast.textContent=text;toastTimer=setTimeout(()=>toast.textContent='',4500);}
function mic(){return '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2" width="6" height="10" rx="3"/><path d="M4 9a6 6 0 0 0 12 0M10 15v3M7 18h6"/></svg>';}
function character(){return '<svg class="character" viewBox="0 0 250 190" aria-hidden="true"><defs><linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bada3"/><stop offset="1" stop-color="#465e67"/></linearGradient></defs><ellipse cx="127" cy="169" rx="47" ry="6" fill="#8ca8c1" opacity=".12"/><g transform="rotate(-5 125 100)"><path d="M105 124l-6 39h17l11-32 7 34h18l-9-42" fill="#384b60"/><path d="M102 78l-12 42 13 5 11-29 28 1 14 26 12-7-20-40" fill="url(#coat)"/><path d="M106 76l-3 55 45 1-5-56" fill="url(#coat)"/><path d="M119 78l7 15 8-15-3 39-10 4 3-27" fill="#d0cec0"/><path d="M107 32q16-13 34 1l4 31-12 16-23-7-8-23z" fill="#9eb8a2"/><path d="M105 39l1-13 23-5 15 11-1 11-12-9-17 7" fill="#42505b"/><path d="M108 52l10-1m13-1 9-1" stroke="#d4ffe9" stroke-width="4"/><path d="M118 66l16-1" stroke="#5b7368" stroke-width="3"/><path d="M105 129l9-7 6 8 11-5 9 8" fill="none" stroke="#435a62" stroke-width="3"/></g><g fill="#96c4bb" opacity=".45"><circle cx="61" cy="65" r="2"/><circle cx="187" cy="110" r="2"/><circle cx="175" cy="45" r="1"/></g></svg>';}
function header(){return '<header class="mast"><div class="brand"><span class="mark" aria-hidden="true">F</span>GameForge AI</div><nav class="nav" aria-label="Navigation du Studio"><button data-notice="Accueil · navigation illustrée dans cette maquette." class="liquid">Accueil</button><button class="active liquid" data-notice="Tu travailles dans ton projet Zombattack.">Mes projets</button><button class="liquid" data-notice="Le thème Prisme est conservé pour ces trois propositions.">Ambiances</button><button class="liquid" data-notice="Les réglages seront accessibles dans l’application.">Réglages</button></nav><span class="save">Brouillon démo enregistré</span></header><div class="identity"><span class="project-icon" aria-hidden="true">Z</span><div><h1>Zombattack</h1><p>Un monde à inventer. Une idée qui prend forme.</p></div><span class="tag">Brief en cours</span></div><nav class="stage-line" aria-label="Étapes de création"><span>01 · Idée</span><strong>02 · Questionnaire</strong><span>03 · Apparence</span><span>04 · Gameplay</span><i></i></nav>';}
function tools(index){return '<div class="answer-tools"><button class="voice liquid" data-voice>'+mic()+' Dicter</button><button class="suggest" data-suggest="'+index+'">✧ M’aider à préciser</button><label class="lock"><input type="checkbox" data-lock="'+index+'" '+(questions[index].locked?'checked':'')+'> Garder ce choix</label></div>';}
function field(index){return '<textarea id="answer-'+index+'" data-answer="'+index+'" maxlength="2400" aria-label="'+esc(questions[index].title)+'" placeholder="'+esc(questions[index].hint)+'">'+esc(questions[index].answer)+'</textarea>';}
function pills(){return '<nav class="chapter-pills" aria-label="Chapitres">'+chapters.map((n,i)=>'<button class="liquid '+(i===chapter?'active':'')+'" data-chapter="'+i+'">'+(i+1)+' · '+n+'</button>').join('')+'</nav>';}
function summary(){return '<ul class="summary-list"><li><b>Genre</b>Course et survie, vue de dos</li><li><b>Univers</b>Une ville après l’apocalypse</li><li><b>Personnage</b>Un livreur qui cherche son équipe</li><li><b>Ambiance</b>Stylisée, avec une touche d’humour</li></ul>';}
function focus(){const q=questions[question];return '<div class="focus-layout"><aside class="rail"><nav aria-label="Chapitres">'+chapters.map((n,i)=>'<button data-chapter="'+i+'" class="liquid '+(i===chapter?'active':'')+'"><span class="dot">'+(i<chapter?'✓':i+1)+'</span>'+n+'</button>').join('')+'</nav><p class="rail-foot">Tu peux revenir à chaque réponse.<br>Ton idée reste à toi.</p></aside><section class="focus-question panel"><div class="position"><span class="track">'+questions.map((q,i)=>'<i class="'+(i<=question?'done':'')+'"></i>').join('')+'</span><span>Question '+(question+1)+' sur 3 · Ennemis</span></div><span class="overline">Donne-leur du caractère</span><h2 id="current-question">'+q.title+'</h2><p class="example">'+q.help+'</p>'+field(question)+tools(question)+'<div class="bottom row"><button class="secondary" data-prev '+(question===0?'disabled':'')+'>← Précédente</button><span class="spacer"></span><button class="primary" data-next>Continuer →</button></div></section><aside class="brief-aside"><span class="overline">Ton jeu, jusqu’ici</span><h3>Les premières briques</h3><div class="aside-visual">'+character()+'<p class="caption">Illustration d’intention</p></div>'+summary()+'<p class="notice">L’apparence sera explorée après le brief, avec quatre propositions à comparer.</p></aside></div>';}
function carnet(){return '<div class="carnet-head"><div><span class="overline">Chapitre 3 / 5 · Ennemis et obstacles</span><h2>Ce qui se dresse<br>sur ton chemin.</h2><p>Quelques détails suffisent pour commencer.<br>Tu pourras enrichir chaque idée à ton rythme.</p></div>'+pills()+'</div><div class="carnet-layout"><section class="carnet-sheet">'+questions.map((q,i)=>'<details '+(i===question?'open':'')+' data-detail="'+i+'"><summary><span class="number">0'+(i+1)+'</span>'+q.title+'<span class="chevron" aria-hidden="true">+</span></summary><div class="detail-body"><p>'+q.help+'</p>'+field(i)+tools(i)+'</div></details>').join('')+'<div class="carnet-bottom"><span class="footnote">Un carnet ouvert.<br>Tout reste modifiable.</span><button class="primary" data-next>Continuer le brief →</button></div></section><aside class="carnet-aside panel"><span class="overline">Note d’intention</span><h3>Inquiétant,<br>avec un peu d’humour.</h3>'+character()+'<p class="option-note">Des silhouettes lisibles, des attitudes maladroites, une ville qui porte les traces du passé.</p>'+summary()+'</aside></div>';}
function dialogue(){return '<div class="dialogue-layout"><section class="conversation"><div class="conversation-head"><span class="avatar" aria-hidden="true">F</span><div><strong>Ton partenaire de création</strong><small>Conversation de démonstration · réponses préparées</small></div></div><div class="bubble assistant">Tu imagines une course dans une ville abandonnée, avec des zombies un peu maladroits. On va leur donner une vraie personnalité.</div><div class="bubble user">Oui, je veux une ambiance inquiétante mais stylisée, avec quelques moments drôles.</div><div class="bubble assistant"><span class="overline">Ennemis · '+(question+1)+' / 3</span><h2>'+questions[question].title+'</h2><p>'+questions[question].help+'</p></div><div class="composer panel">'+field(question)+'<div class="row"><button class="voice liquid" data-voice>'+mic()+' Raconter à voix haute</button><span class="spacer"></span><button class="primary" data-next>Valider ma réponse ↑</button></div></div><div class="conversation-bottom"><button class="quiet" data-prev '+(question===0?'disabled':'')+'>← Revoir la question précédente</button><button class="quiet" data-suggest="'+question+'">✧ Besoin d’une piste ?</button></div><p class="footnote">Tes mots sont conservés. Tu peux les relire et les corriger avant de continuer.</p></section><aside class="dialogue-aside panel"><span class="overline">Le fil de ton idée</span><h3>Zombattack</h3><div class="progress"><span></span></div><span class="footnote">Chapitre 3 sur 5</span>'+summary()+character()+'<div class="next-step"><strong>À venir · les règles du jeu</strong>Les actions, les défis, puis ce qui rend chaque partie différente.</div></aside></div>';}
function render(){studio.className=(theme==='clair'?'light ':'')+(reduced?'reduced':'');document.body.classList.toggle('reduced',reduced);studio.innerHTML='<div class="wrap">'+header()+(layout==='focus'?focus():layout==='carnet'?carnet():dialogue())+'<footer class="demo-footer"><span>'+({focus:'01 · Focus — une question à la fois, avec ton brief à portée de regard.',carnet:'02 · Carnet — une lecture libre, pour développer chaque idée à ton rythme.',dialogue:'03 · Dialogue — un échange guidé, avec le fil du projet à côté.'}[layout])+'<br>Maquette interactive · données fictives · aucun envoi à une IA.</span><button data-retain>Retenir '+variants[layout]+' ↗</button></footer></div>';document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layout===layout));document.querySelector('#theme').textContent=theme==='clair'?'Passer en sombre':'Passer en clair';document.querySelector('#motion').setAttribute('aria-pressed',String(reduced));document.querySelector('#motion').textContent=reduced?'Activer les effets':'Réduire les effets';}
document.addEventListener('input',e=>{if(e.target.matches('[data-answer]')){questions[Number(e.target.dataset.answer)].answer=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.matches('[data-lock]'))questions[Number(e.target.dataset.lock)].locked=e.target.checked;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;render();}else if(b.id==='theme'){theme=theme==='clair'?'sombre':'clair';render();}else if(b.id==='motion'){reduced=!reduced;render();}else if(b.hasAttribute('data-next')){if(question<2){question++;save();render();document.querySelector('[data-answer]')?.focus();}else notify('Fin de ce chapitre de démonstration. La suite abordera les règles du jeu.');}else if(b.hasAttribute('data-prev')){question=Math.max(0,question-1);save();render();document.querySelector('[data-answer]')?.focus();}else if(b.hasAttribute('data-voice'))document.querySelector('#voice-demo').showModal();else if(b.id==='close-voice')document.querySelector('#voice-demo').close();else if(b.hasAttribute('data-suggest'))notify('Piste de démonstration : précise une silhouette, une attitude et le signe qui annonce le danger.');else if(b.hasAttribute('data-retain')){try{localStorage.setItem('gameforge-questionnaire-choice',layout);}catch{}notify('Choix '+variants[layout]+' mémorisé dans cette maquette. Indique-le aussi dans la conversation.');}else if(b.hasAttribute('data-chapter')){if(Number(b.dataset.chapter)===2){chapter=2;render();}else notify('Cette maquette détaille le chapitre Ennemis. Les autres chapitres suivront cette présentation.');}else if(b.dataset.notice)notify(b.dataset.notice);});
document.addEventListener('pointermove',e=>{if(reduced||e.pointerType!=='mouse')return;aura.style.left=e.clientX+'px';aura.style.top=e.clientY+'px';aura.style.opacity='1';const b=e.target.closest('.liquid');if(b){const box=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-box.left)+'px');b.style.setProperty('--my',(e.clientY-box.top)+'px');}});document.documentElement.addEventListener('pointerleave',()=>aura.style.opacity='0');matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change',e=>{reduced=e.matches;render();});render();
</script>
</body></html>
