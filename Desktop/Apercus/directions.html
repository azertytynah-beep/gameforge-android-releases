hover{border-color:var(--accent)}.project strong{font-size:16px;display:block}.project small,.sub{display:block;color:var(--dim);margin-top:3px;font-size:13px}.project b{margin-left:auto;color:var(--accent);font-size:20px}.thumb{width:93px;height:60px;border-radius:9px;display:block;flex:none}canvas{display:block}.hero{position:relative;isolation:isolate;overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.feature{position:relative}.prisme{background:radial-gradient(ellipse at 68% 21%,#2b334f 0,transparent 58%),var(--bg)}.prisme .hero{margin-top:20px;padding:clamp(32px,4vw,58px);min-height:290px;display:flex;align-items:center;border:1px solid var(--line);border-radius:26px;background:#171d2d}.prisme .hero .copy{width:54%}.prisme .mast{border:0}.prisme .links{border:1px solid var(--line);border-radius:99px;background:#ffffff08;padding:3px 13px}.prisme .links button{border:0;border-radius:40px;padding:8px 14px}.prisme .links .active{background:#ffffff16}.prisme .hero h1{color:#fbfbff}.prisme .hero .eyebrow,.prisme .hero .lead{color:#cfd6ea}.prisme.clair{--bg:#f4f3fa;--fg:#242435;--panel:#ffffffcb;--dim:#525867;--line:#31364c33;--accent:#4d3e91;--ink:white;background:radial-gradient(ellipse at 68% 0%,#d7e8f4,transparent 65%),var(--bg)}.prisme.clair .hero .action{background:#c9f8ec;color:#162521}

<body><header class="tools"><strong>Maquettes du Studio</strong><label>Direction <select id="style"><option value="prisme">Prisme</option><option value="carnet">Herbier</option><option value="arcade">Arcade</option></select></label><label>Thème <select id="mode"><option value="sombre">Sombre</option><option value="clair">Clair</option></select></label><button id="motion" aria-pressed="false">Pause du décor</button><button id="pick">Retenir cette direction</button></header>
<main id="studio"></main>
<script>
const studio=document.querySelector('#studio'),style=document.querySelector('#style'),mode=document.querySelector('#mode'),motion=document.querySelector('#motion'),pick=document.querySelector('#pick');
const names={prisme:'Prisme',carnet:'Herbier',arcade:'Arcade'},media=matchMedia('(prefers-reduced-motion: reduce)');
const projectNames=['Les jardins de Minuit','Traversée d’ambre'],steps=['Questionnaire · Ennemis et obstacles','Apparence · Choix de la maquette'];
let paused=media.matches,frame=0,last=0,clock=0,retained='';
try{retained=localStorage.getItem('gameforge-maquette')||'';}catch{}
const params=new URLSearchParams(location.search);
if(Object.hasOwn(names,params.get('style')))style.value=params.get('style');
if(['clair','sombre'].includes(params.get('theme')))mode.value=params.get('theme');
function nav(){return '<header class="mast"><div class="brand"><i aria-hidden="true">F</i> GameForge AI</div><nav class="links" aria-label="Studio"><button class="active" data-go="home">Accueil</button><button data-go="projects">Mes projets</button></nav></header>';}
function cards(){return '<section id="projects"><div class="row"><h2>Mes projets</h2><span class="sub">2 brouillons</span></div><div class="cards">'+projectNames.map((name,i)=>'<button class="project" data-go="p'+i+'"><canvas aria-hidden="true" class="thumb" data-art="thumb'+i+'"></canvas><span><strong>'+name+'</strong><small>'+steps[i]+'</small></span><b aria-hidden="true">↗</b></button>').join('')+'</div></section>';}
function cta(){return '<button class="action" data-go="new">＋ Créer un jeu</button>';}
function render(){
 const s=style.value;studio.className=s+' '+mode.value;
 const art='<canvas class="art" data-art="hero" aria-hidden="true"></canvas>';
 const hero=s==='prisme'?'<section class="hero">'+art+'<div class="copy"><span class="eyebrow">Atelier de création</span><h1>Nouveau jeu</h1><p class="lead">Décris ton idée pour commencer le brief.</p><div class="actions">'+cta()+'</div></div></section>':s==='carnet'?'<section class="hero"><div class="copy"><span class="eyebrow">Projet en cours · Runner 3D</span><h1>Les jardins<br><em>de Minuit</em></h1><p class="lead">Reprends la description de tes ennemis.</p><div class="actions"><button class="action" data-go="p0">Reprendre le brief →</button>'+cta().replace('class="action"','class="secondary"')+'</div></div><div class="print">'+art.replace('class="art"','')+'</div></section>':'<section class="hero"><div class="feature">'+art.replace('class="art"','')+'</div><div class="copy"><span class="eyebrow">Projet actif / Runner 3D</span><h1>Les jardins<br>de Minuit</h1><p class="lead">Chapitre 3 sur 5 · Ennemis et obstacles</p><div class="actions"><button class="action" data-go="p0">▶ Reprendre</button>'+cta().replace('class="action"','class="secondary"')+'</div></div></section>';
 studio.innerHTML='<div class="inner">'+nav()+'<div class="content">'+hero+cards()+'</div></div><dialog><h2></h2><p></p><button class="secondary">Fermer</button></dialog>';
 studio.querySelector('dialog button').onclick=()=>studio.querySelector('dialog').close();
 pick.textContent=retained===s+'-'+mode.value?'✓ Direction retenue':'Retenir cette direction';
 pick.setAttribute('aria-pressed',String(retained===s+'-'+mode.value));schedule(true);
}
studio.onclick=e=>{const dest=e.target.closest('[data-go]')?.dataset.go;if(!dest)return;
 if(dest==='home'){window.scrollTo(0,0);return;}if(dest==='projects'){document.querySelector('.project').focus();return;}
 const d=studio.querySelector('dialog');d.querySelector('h2').textContent=dest==='new'?'Créer un jeu':projectNames[Number(dest[1])];
 d.querySelector('p').textContent=dest==='new'?'Dans le Studio, cette action ouvre un nouveau brief. Tu peux nommer ton jeu maintenant ou plus tard.':'Ce projet de démonstration reprend à l’étape « '+steps[Number(dest[1])]+' ».';
 d.showModal();};
pick.onclick=()=>{retained=style.value+'-'+mode.value;try{localStorage.setItem('gameforge-maquette',retained)}catch{}render()};
function motionState(){motion.textContent=paused?'Décor en pause':'Pause du décor';motion.setAttribute('aria-pressed',String(paused));schedule(true)}
motion.onclick=()=>{paused=!paused;motionState()};media.onchange=()=>{paused=media.matches;motionState()};style.onchange=mode.onchange=render;
</script>
<script>
function gradient(ctx,x,y,x2,y2,stops){const g=ctx.createLinearGradient(x,y,x2,y2);stops.forEach(([n,c])=>g.addColorStop(n,c));return g;}
function polygon(c,points,ink){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=ink;c.fill();}
function rng(seed){return ()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296);}
function ellipse(c,x,y,rx,ry,angle,fill){c.beginPath();c.ellipse(x,y,rx,ry,angle,0,Math.PI*2);c.fillStyle=fill;c.fill();}
function glass(c,w,h,t,thumbnail,amber){
 const bg=amber?['#21152f','#513050','#39475b']:['#151a2a','#293655','#23464f'];
 c.fillStyle=gradient(c,0,h,w,0,[[0,bg[0]],[.55,bg[1]],[1,bg[2]]]);c.fillRect(0,0,w,h);
 const cx=w*(thumbnail?.54:w/h<1.6?.7:.77),cy=h*(thumbnail?.49:.47);
 const size=Math.min(thumbnail?w*.63:w*.28,h*.61),tau=Math.PI*2;
 const light=c.createRadialGradient(cx,cy,0,cx,cy,size*1.6);light.addColorStop(0,amber?'#eb8b814e':'#8ef1db50');light.addColorStop(1,'#8599bb00');
 c.fillStyle=light;c.fillRect(0,0,w,h);
 // A modulated torus, projected and depth-sorted with lighting from its surface normal.
 const az=-.53+t*.09,tilt=.86+t*.07,ca=Math.cos(az),sa=Math.sin(az),cb=Math.cos(tilt),sb=Math.sin(tilt);
 function project(u,v){
  const twist=2*u+.55,major=.81+.12*Math.cos(3*u),tube=.24+.055*Math.sin(2*u);
  const x=(major+tube*Math.cos(v))*Math.cos(u),y=(major+tube*Math.cos(v))*Math.sin(u),z=.28*Math.sin(twist)+tube*Math.sin(v);
  const a=x*ca-y*sa,b=x*sa+y*ca;
  return [cx+size*(a+.19*(b*sb+z*cb)),cy+size*(b*cb-z*sb),b*sb+z*cb];
 }
 const nu=96,nv=28,pts=Array.from({length:nu},(_,i)=>Array.from({length:nv},(_,j)=>project(i*tau/nu,j*tau/nv)));
 const faces=[];
 for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
  const p=pts[i][j],a=pts[(i+1)%nu][j],b=pts[i][(j+1)%nv],q=pts[(i+1)%nu][(j+1)%nv];
  const ax=(a[0]-p[0])/size,ay=(a[1]-p[1])/size,az=a[2]-p[2],bx=(b[0]-p[0])/size,by=(b[1]-p[1])/size,bz=b[2]-p[2];
  const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx,L=Math.hypot(nx,ny,nz)||1;
  if(nz<0)continue;
  const n=nx/L,m=ny/L,k=nz/L,ref=Math.abs(.45*n-.83*m+.27*k);
  const band=Math.exp(-Math.pow((ref-.76)/.065,2)),shine=Math.pow(Math.max(0,-.44*n-.75*m+.48*k),11);
  const hue=amber?23+42*n+17*k:189+65*n+42*m;
  const tone=Math.max(16,Math.min(96,36+17*k+9*m+30*band+48*shine));
  faces.push({z:p[2]+a[2]+b[2]+q[2],points:[p,a,q,b],color:'hsl('+hue+', '+(48-16*band)+'%, '+tone+'%)'});
 }
 faces.sort((a,b)=>a.z-b.z);
 c.lineWidth=.55;c.lineJoin='round';
 for(const f of faces){polygon(c,f.points,f.color);c.strokeStyle=f.color;c.stroke();}
}
function herb(c,w,h,t,thumb,amber){
 c.save();c.scale(w/600,h/310);const rand=rng(amber?919:47);
 const paper=amber?'#e4ad78':'#e3ce94',ink=amber?'#623c39':'#243e31';
 c.fillStyle=paper;c.fillRect(0,0,600,310);
 c.strokeStyle=amber?'#996442':'#9e9867';c.lineWidth=.6;
 for(let i=0;i<180;i++){const x=rand()*600,y=rand()*310;c.beginPath();c.moveTo(x,y);c.lineTo(x+2+rand()*5,y+rand()*2);c.stroke();}
 const sunX=420+t*3;ellipse(c,sunX,97,62,62,0,amber?'#f5dba4':'#f7e8b6');
 c.save();c.beginPath();c.arc(sunX,97,62,0,Math.PI*2);c.clip();c.lineWidth=1;c.strokeStyle=paper;
 for(let y=107;y<162;y+=4){c.beginPath();c.moveTo(sunX-65,y);c.lineTo(sunX+65,y);c.stroke();}c.restore();
 for(let layer=0;layer<3;layer++){
  let ridge=x=>166+layer*42+23*Math.sin(x*.012+layer)+9*Math.cos(x*.023-layer*3);
  let edge=Array.from({length:102},(_,i)=>[i*6,ridge(i*6)]);
  polygon(c,[...edge,[605,315],[0,315]],(amber?['#c58559','#a36550','#704a43']:['#adb080','#818e67','#63795a'])[layer]);
  c.strokeStyle=amber?'#915c4c':'#566e54';c.lineWidth=.7;
  for(let j=3;j<50;j+=4){c.beginPath();edge.forEach(([x,y],i)=>i?c.lineTo(x,y+j+Math.sin(x*.01)*j*.12):c.moveTo(x,y+j));c.stroke();}
 }
 c.lineCap='round';
 function sprig(x,y,length,lean,leaves){
  c.save();c.translate(x,y);c.rotate(lean+.013*t);c.strokeStyle=ink;c.lineWidth=2.3;
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(10,-length*.5,0,-length);c.stroke();
  for(let j=1;j<=leaves;j++){
   const k=j/(leaves+1),cy=-length*k,scale=(.4+.68*Math.sin(Math.PI*k))*(length/7),stem=4*Math.sin(k*Math.PI);
   for(const side of [-1,1]){
    c.save();c.translate(stem,cy+(side===1?4:0));c.rotate(side*(1.12-.43*k));c.beginPath();c.moveTo(0,2);c.bezierCurveTo(-scale*.42,-scale*.35,-scale*.20,-scale*.92,0,-scale*1.35);c.bezierCurveTo(scale*.23,-scale*.87,scale*.33,-scale*.27,0,2);c.fillStyle=ink;c.fill();
    c.strokeStyle=paper;c.lineWidth=.7;c.beginPath();c.moveTo(0,0);c.lineTo(0,-scale*1.13);c.stroke();c.restore();
   }
  }c.restore();
 }
 for(const v of [[55,335,200,-.37,8],[65,313,273,.19,11],[100,318,202,.55,9],[135,325,159,.8,8],[483,330,126,-.28,7],[530,345,205,.36,9],[589,335,167,-.27,8]])sprig(...v);
 c.restore();
}
function pixel(c,w,h,t,thumb,amber){
 const pw=290,ph=150;c.save();c.scale(w/pw,h/ph);c.imageSmoothingEnabled=false;
 const palette=amber?['#3e2d4d','#cb766e','#ffe09c','#975f73','#734d67','#593e55','#402f48','#ca8a69']:['#29214a','#906d9f','#ffd3a0','#776591','#584e78','#3b3d59','#232941','#8bb986'];
 c.fillStyle=gradient(c,0,0,0,ph,[[0,palette[0]],[.68,palette[1]],[1,palette[2]]]);c.fillRect(0,0,pw,ph);
 const rand=rng(13);c.fillStyle=palette[2];for(let i=0;i<40;i++){const x=Math.floor(rand()*pw),y=Math.floor(rand()*65);c.fillRect(x,y,1,1);}
 for(let y=-17;y<18;y++){let span=Math.floor(Math.sqrt(Math.max(0,18*18-y*y)));if(y<5||y%4!==0)c.fillRect(202-span+Math.round(2*t),32+y,span*2,1);}
 for(let layer=0;layer<3;layer++){c.fillStyle=palette[layer+3];for(let x=0;x<pw;x+=2){
  let y=63+layer*14+12*Math.sin(x*(.026+.004*layer)+layer*2)+7*Math.abs(Math.sin(x*.081+layer));
  c.fillRect(x,Math.round(y),2,ph-y+2);}}
 function pine(x,y,height,color){c.fillStyle=color;c.fillRect(x-1,y-height,2,height);for(let j=4;j<height-2;j+=3){let spread=Math.round(j*.26);c.fillRect(x-spread,y-height+j,spread*2+1,3);}}
 for(let x=0;x<300;x+=6+Math.floor(rand()*9))pine(x,108+Math.floor(rand()*8),14+rand()*26,palette[5]);
 function ledge(x,y,l){c.fillStyle=palette[6];c.fillRect(x,y,l,ph-y);c.fillStyle=palette[7];c.fillRect(x,y,l,3);c.fillStyle='#665975';for(let j=2;j<l-4;j+=7)c.fillRect(x+j,y+6+Math.round(rand()*4),4,2);}
 ledge(0,115,98);ledge(114,105,73);ledge(209,94,83);
